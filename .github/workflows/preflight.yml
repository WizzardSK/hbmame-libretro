name: preflight
on: [push, workflow_dispatch]
jobs:
  android-x86_64:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: as-the-job-runs-it, extra: "" }
          - { name: with-osd-retro,     extra: "OSD=retro" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: put the NDK where the Makefile looks for it
        run: |
          sudo mkdir -p /android-sdk-linux/ndk
          sudo ln -s "$ANDROID_NDK_LATEST_HOME" /android-sdk-linux/ndk/29.0.14206865
          ls -la /android-sdk-linux/ndk/
      - name: build (${{ matrix.name }})
        run: |
          make -f Makefile.libretro platform=android-x86_64 TARGET=hbmame REGENIE=0 \
            ANDROID_NDK_NEXT=29.0.14206865 ${{ matrix.extra }} -j$(nproc) > build.log 2>&1 || {
            echo "=== FAILED ==="
            sed -n "340,380p" build.log
            exit 1
          }
          ls -la *_libretro_android.so
          file *_libretro_android.so
